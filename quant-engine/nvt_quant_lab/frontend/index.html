<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="NVT Quant Lab — AI-Powered Portfolio Risk Analysis Platform. Monte Carlo simulation, Stress Test, Backtest, Advanced Metrics."/>
    <title>NVT Quant Lab · Portfolio Risk Analysis</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>


    <!-- App Stylesheet -->
    <link rel="stylesheet" href="css/app.css"/>

    <!-- External Libraries -->
    <!-- Plotly.js: Used by Risk Analysis for Monte Carlo, Backtest, Allocation, Revenue charts -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
    <!-- html2pdf: Used by Reports page for PDF export -->
    <script src="js/lib/html2pdf.bundle.min.js"></script>
</head>
<body>
    <!--
    ╔══════════════════════════════════════════════════════╗
    ║   NVT Quant Lab · SPA Shell                         ║
    ║   Hash-based routing: JS modules in /js/app.js      ║
    ║   Backend: FastAPI at /api/* (Same-origin)          ║
    ╚══════════════════════════════════════════════════════╝

    Layout:
    ┌─────────────────────────────────────────────────┐
    │  #sidebar-container │  #topbar-container        │
    │  (Sidebar.js)       ├───────────────────────────│
    │                     │  #main-content            │
    │                     │  (rendered by views/*.js) │
    └─────────────────────────────────────────────────┘
    Global: #chat-widget-root (ChatWidget.js, appended to body)
    -->

    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar-container">
            <!-- Rendered by js/components/Sidebar.js -->
        </div>

        <!-- Topbar -->
        <div id="topbar-container">
            <!-- Rendered by js/components/Topbar.js -->
            <header class="topbar">
                <div class="topbar-left">
                    <div class="topbar-breadcrumb">
                        <span class="breadcrumb-app">NVT Quant Lab</span>
                        <span class="breadcrumb-sep">›</span>
                        <span class="breadcrumb-page">Đang tải...</span>
                    </div>
                </div>
            </header>
        </div>

        <!-- Main Content Area — replaced on every route -->
        <main id="main-content">
            <!-- Initial loading state -->
            <div style="display:flex;align-items:center;justify-content:center;height:50vh;flex-direction:column;gap:1rem;color:var(--text-muted);">
                <div style="width:40px;height:40px;border:3px solid rgba(0,255,170,0.15);border-top-color:#00ffaa;border-radius:50%;animation:spin 0.9s linear infinite;"></div>
                <span style="font-size:0.9rem;">Đang khởi động NVT Quant Lab...</span>
            </div>
        </main>
    </div>

    <!-- SPA Entry Point: ES Module -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
